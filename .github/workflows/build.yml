name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU sanitizers
        run: cmake -S . -B build -DBDG_ENABLE_CUDA=OFF -DBDG_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j2
      - name: CPU tests (GPU test is explicitly skipped)
        run: ctest --test-dir build --output-on-failure
  cuda-compile:
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake g++
      - name: Configure CUDA
        run: cmake -S . -B build -DBDG_REQUIRE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=80 -DCMAKE_BUILD_TYPE=Release
      - name: Compile (no GPU on this runner)
        run: cmake --build build -j2
      - name: CPU checks only
        run: ctest --test-dir build --output-on-failure -LE gpu
